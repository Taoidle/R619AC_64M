name: R619AC 64M LEDE

on:
  push:
    branches:
      - master
  workflow_dispatch:
  repository_dispatch:
  schedule:
    - cron: "30 2 1,16 * *"

permissions:
  contents: write

concurrency:
  group: r619ac-64m-${{ github.ref }}
  cancel-in-progress: true

env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  CONFIG_FILE: r619ac_64m.config
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize build environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          docker image prune -f
          sudo -E rm -rf /usr/share/dotnet /etc/mysql /etc/php /etc/apt/sources.list.d /usr/local/lib/android
          sudo -E apt-mark hold grub-efi-amd64-signed
          sudo -E apt update
          sudo -E apt -y purge azure-cli* docker* ghc* zulu* llvm* firefox google* dotnet* powershell* openjdk* mysql* php* mongodb* snap*
          sudo -E apt -y full-upgrade
          sudo -E apt -y install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk gcc-multilib g++-multilib gettext genisoimage git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool llvm lrzsz msmtp ninja-build p7zip p7zip-full patch pkgconf python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
          sudo -E systemctl daemon-reload
          sudo -E apt -y autoremove --purge
          sudo -E apt clean
          sudo -E timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir
          sudo chown "$USER:$GROUPS" /workdir

      - name: Clone latest LEDE source
        working-directory: /workdir
        run: |
          df -hT "$PWD"
          git clone --depth 1 --branch "$REPO_BRANCH" "$REPO_URL" openwrt
          ln -s /workdir/openwrt "$GITHUB_WORKSPACE/openwrt"
          echo "LEDE_COMMIT=$(git -C openwrt rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Load custom packages
        run: |
          git clone --depth 1 https://github.com/kenzok8/openwrt-packages.git openwrt/package/openwrt-packages
          git clone --depth 1 https://github.com/kenzok8/small.git openwrt/package/small
          # These unused packages currently introduce recursive Kconfig dependencies.
          rm -rf openwrt/package/small/luci-app-fchomo
          rm -rf openwrt/package/openwrt-packages/luci-app-easymesh

      - name: Update and install feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load and validate configuration
        run: |
          cp "$CONFIG_FILE" openwrt/.config
          cd openwrt
          sed -i 's/192.168.1.1/192.168.10.1/g' package/base-files/files/bin/config_generate
          sed -i 's/OpenWrt/R619ac/g' package/base-files/files/bin/config_generate
          sed -i "s/OpenWrt /Leopard build $(date "+%Y.%m.%d") @ OpenWrt /g" package/lean/default-settings/files/zzz-default-settings
          sed -i '/^CONFIG_KERNEL_BUILD_USER=/d; /^CONFIG_KERNEL_BUILD_DOMAIN=/d' .config
          printf '%s\n' 'CONFIG_KERNEL_BUILD_USER="Leopard"' 'CONFIG_KERNEL_BUILD_DOMAIN="GitHub Actions"' >> .config
          make defconfig
          grep -q '^CONFIG_TARGET_DEVICE_ipq40xx_generic_DEVICE_p2w_r619ac-64m=y$' .config

      - name: Download packages
        working-directory: openwrt
        run: |
          make download -j8
          find dl -size -1024c -print -delete

      - name: Compile firmware
        working-directory: openwrt
        run: |
          echo "$(nproc) thread compile"
          make -j"$(nproc)" || make -j1 V=s
          echo "FILE_DATE=$(date +"%Y%m%d%H%M")" >> "$GITHUB_ENV"

      - name: Check space usage
        if: always()
        run: df -hT

      - name: Organize firmware
        run: |
          FIRMWARE_DIR="$GITHUB_WORKSPACE/openwrt/bin/targets/ipq40xx/generic"
          test -d "$FIRMWARE_DIR"
          rm -rf "$FIRMWARE_DIR/packages"
          echo "FIRMWARE=$FIRMWARE_DIR" >> "$GITHUB_ENV"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: R619AC_64M_${{ env.FILE_DATE }}
          path: ${{ env.FIRMWARE }}
          if-no-files-found: error
          retention-days: 14

      - name: Generate release information
        id: release
        run: |
          RELEASE_TAG="$(date +"%Y.%m.%d-%H%M")"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          {
            echo "R619AC 64M firmware built from the latest LEDE master branch."
            echo
            echo "- LEDE commit: `$LEDE_COMMIT`"
            echo "- Configuration: `r619ac_64m.config`"
            echo "- Build run: `$GITHUB_RUN_ID`"
          } > release.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ github.token }}
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.tag }}
          body_path: release.txt
          files: ${{ env.FIRMWARE }}/*
          fail_on_unmatched_files: true
          make_latest: true
